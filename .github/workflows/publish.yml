name: Publish

env:
  DotNetVersion: '11.0.x'
  AvaloniaAppDir: src/BD.WTTS.Client.Avalonia.App
  PublishToolDir: src/BD.WTTS.Client.Tools.Publish
  ReleaseName: Steam++ Linux amd64 (latest)
  ReleaseTag: linux-latest

on:
  # 仅支持手动触发
  workflow_dispatch:

jobs:
  publish-linux-x64:
    name: Build & Publish Linux amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DotNetVersion }}

    - name: Stage .NET runtime (linux-x64)
      shell: bash
      run: |
        set -e
        # 发布工具的 Linux 分支会把该目录下的运行时复制进发布产物
        runtime_dir="${{ env.AvaloniaAppDir }}/bin/Release/Publish/dotnet-Runtime/Linux-X64"
        mkdir -p "$runtime_dir"
        # 使用与当前 SDK 一致的运行时版本，避免发布产物运行时补丁版本不一致
        runtime_version="$(dotnet --list-runtimes | grep 'Microsoft.AspNetCore.App' | awk '{print $2}' | head -n1)"
        if [ -z "$runtime_version" ]; then
          echo "未检测到 Microsoft.AspNetCore.App 运行时版本" >&2
          exit 1
        fi
        echo "下载 aspnetcore 运行时: $runtime_version (linux-x64)"
        dotnet-install_dir="$(mktemp -d)"
        curl -sSL https://dot.net/v1/dotnet-install.sh -o "$dotnet-install_dir/dotnet-install.sh"
        chmod +x "$dotnet-install_dir/dotnet-install.sh"
        "$dotnet-install_dir/dotnet-install.sh" --runtime aspnetcore --version "$runtime_version" --install-dir "$runtime_dir" --no-path

    - name: Stage Linux launcher scripts (ShellScript/Linux)
      shell: bash
      run: |
        set -e
        # 发布工具会将该目录下的脚本拷贝进发布目录并生成 Steam++.sh 启动脚本
        script_dir="${{ env.AvaloniaAppDir }}/bin/Release/Publish/ShellScript/Linux"
        mkdir -p "$script_dir"
        cat > "$script_dir/Steam++.sh" <<'EOF'
        #!/bin/sh
        # Steam++ Linux 启动脚本（CI 内置占位脚本，请按需替换为正式版本）
        exec "$(dirname "$0")/dotnet/dotnet" "$(dirname "$0")/Steam++.dll" "$@"
        EOF
        chmod +x "$script_dir/Steam++.sh"

    - name: Build & Pack Linux amd64 (linux-x64)
      shell: bash
      run: |
        dotnet run --project "${{ env.PublishToolDir }}/BD.WTTS.Client.Tools.Publish.csproj" -c Release -- run --rids linux-x64

    - name: Collect artifacts
      id: artifacts
      shell: bash
      run: |
        set -e
        publish_root="${{ env.AvaloniaAppDir }}/bin/Release/Publish"
        release_dir="$RUNNER_TEMP/release"
        mkdir -p "$release_dir"
        tar_file="$(ls "$publish_root"/*linux_x64*.tar.gz 2>/dev/null | head -n1)"
        json_file="$(ls "$publish_root"/*linux_x64*.json 2>/dev/null | head -n1)"
        if [ -z "$tar_file" ]; then
          echo "未找到 linux_x64 tar.gz 产出物" >&2
          exit 1
        fi
        cp "$tar_file" "$release_dir/Steam++_linux_x64.tar.gz"
        if [ -n "$json_file" ]; then
          cp "$json_file" "$release_dir/Steam++_linux_x64.json"
        fi
        echo "ARTIFACTS_DIR=$release_dir" >> "$GITHUB_ENV"

    - name: Get commit log
      id: changelog
      shell: bash
      run: |
        last_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
        if [ -n "$last_tag" ]; then
          commit_log="$(git log --oneline --no-merges "$last_tag"..HEAD | head -n 40)"
        else
          commit_log="$(git log --oneline --no-merges -20)"
        fi
        {
          echo "COMMIT_LOG<<CHANGELOG_EOF"
          echo "$commit_log"
          echo "CHANGELOG_EOF"
        } >> "$GITHUB_ENV"

    - name: Publish to latest Release
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ env.ReleaseTag }}
        name: ${{ env.ReleaseName }}
        commit: ${{ github.sha }}
        artifacts: ${{ env.ARTIFACTS_DIR }}/*
        allowUpdates: true
        replacesArtifacts: true
        makeLatest: true
        body: |
          ## Steam++ Linux amd64 最新构建
          * 由 GitHub Action 手动触发构建并自动更新到此 Latest Release。

          ## 更新日志
          ${{ env.COMMIT_LOG }}

          ## 文件
          - Steam++_linux_x64.tar.gz：Linux amd64 压缩包
          - Steam++_linux_x64.json：发布文件清单