<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pika+</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f6f8; color: #1f2329; height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 12px 20px;
      border-bottom: 1px solid #e4e6ea; background: #fff;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #cfd3d9; flex: none; }
    .dot.running { background: #21b06a; box-shadow: 0 0 8px #21b06a; }
    #statusTxt { font-size: 13px; color: #5a616b; }
    .spacer { flex: 1; }
    .btn {
      border: 0; border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer;
      background: #2b6cff; color: #fff; transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn.stop { background: #cf3a45; }
    .btn.ghost {
      background: #fff; color: #2b6cff; border: 1px solid #cdd4de;
    }
    .btn.ghost:hover { filter: brightness(0.97); }
    main { flex: 1; overflow-y: auto; padding: 16px 20px; max-width: 820px; width: 100%; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e4e6ea; border-radius: 12px; padding: 14px 16px; }
    .cardhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .card h2 { font-size: 14px; font-weight: 600; color: #3c4147; }
    .btn.small { padding: 4px 12px; font-size: 12px; border-radius: 6px; }
    .log {
      height: 62vh; overflow-y: auto; background: #0f1115; color: #c8d1d9;
      border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <header>
    <div class="dot" id="statusDot"></div>
    <h1>Pika+</h1>
    <span id="statusTxt">未运行</span>
    <div class="spacer"></div>
    <button class="btn ghost" id="btnExport" title="导出根证书到可执行文件同目录">导出证书</button>
    <button class="btn ghost" id="btnInstall" title="安装根证书到系统信任库（需授权）">导入系统证书</button>
    <button class="btn" id="btnToggle">开始加速</button>
  </header>

  <main>
    <div class="card">
      <div class="cardhead">
        <h2>运行日志</h2>
        <button class="btn ghost small" id="btnClear">清空</button>
      </div>
      <pre id="logView" class="log"></pre>
    </div>
  </main>

  <script>
    const invoke = window.__TAURI__.core.invoke;
    const $ = (id) => document.getElementById(id);
    let running = false;

    async function refresh() {
      const s = await invoke('status');
      running = s.running;
      $('statusDot').className = 'dot' + (running ? ' running' : '');
      $('statusTxt').textContent = running ? '运行中' : '未运行';
      $('btnToggle').textContent = running ? '停止加速' : '开始加速';
      $('btnToggle').className = 'btn' + (running ? ' stop' : '');
    }

    $('btnToggle').onclick = async () => {
      try {
        if (running) { await invoke('stop_proxy'); }
        else { await invoke('start_proxy'); }
        await refresh();
      } catch (e) { }
    };

    refresh().catch(() => {});
    setInterval(() => { refresh().catch(() => {}); }, 3000);

    let lastLogLen = 0;
    async function pollLogs() {
      try {
        const all = await invoke('get_logs');
        const lines = all.slice(-100); // 只显示最新 100 条
        if (lines.length !== lastLogLen) {
          lastLogLen = lines.length;
          const lv = $('logView');
          lv.textContent = lines.join('\n');
          lv.scrollTop = lv.scrollHeight;
        }
      } catch (e) {}
    }
    setInterval(pollLogs, 1200);
    pollLogs();

    $('btnClear').onclick = async () => {
      lastLogLen = 0;
      $('logView').textContent = '';
      try { await invoke('clear_logs'); } catch (e) {}
    };

    $('btnExport').onclick = async () => {
      try {
        const p = await invoke('export_ca');
        console.log('证书已导出到: ' + p);
      } catch (e) { console.log('导出失败: ' + e); }
    };
    $('btnInstall').onclick = async () => {
      try {
        const msg = await invoke('install_ca');
        console.log(msg);
      } catch (e) { console.log('导入失败: ' + e); }
    };
  </script>
</body>
</html>
