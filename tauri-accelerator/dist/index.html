<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steam++ 网络加速</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f6f8; color: #1f2329; height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 16px 22px;
      border-bottom: 1px solid #e4e6ea; background: #fff;
    }
    header h1 { font-size: 17px; font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #cfd3d9; }
    .dot.running { background: #21b06a; box-shadow: 0 0 8px #21b06a; }
    .spacer { flex: 1; }
    .btn {
      border: 0; border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer;
      background: #2b6cff; color: #fff; transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn.stop { background: #cf3a45; }
    .btn.ghost { background: #eef1f5; color: #333; }
    main { flex: 1; overflow-y: auto; padding: 20px 22px; max-width: 860px; width: 100%; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e4e6ea; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #3c4147; }
    .host-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
    .host-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
      background: #f7f8fa; border: 1px solid #ebedf0; cursor: pointer; font-size: 13px;
    }
    .host-item input { accent-color: #2b6cff; width: 15px; height: 15px; }
    .act { display: flex; gap: 10px; }
    .hint { font-size: 12px; color: #8a919c; line-height: 1.7; }
    .msg { font-size: 13px; color: #2b6cff; min-height: 18px; margin-top: 6px; }
    .log {
      height: 180px; overflow-y: auto; background: #0f1115; color: #c8d1d9;
      border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <header>
    <div class="dot" id="statusDot"></div>
    <h1>Steam++ 网络加速</h1>
    <div class="spacer"></div>
    <span id="statusTxt">未运行</span>
    <button class="btn" id="btnToggle">开始加速</button>
  </header>

  <main>
    <div class="card">
      <h2>HTTPS 加速证书</h2>
      <div class="act">
        <button class="btn ghost" id="btnExportCa">导出根证书</button>
        <button class="btn ghost" id="btnInstallCa">安装到系统</button>
      </div>
      <div class="hint" style="margin-top:10px">勾选域名后需让系统信任根证书，HTTPS 加速才会生效。安装到系统会自动提权并写入信任库。</div>
      <div class="msg" id="certMsg"></div>
    </div>

    <div class="card">
      <h2>加速域名（勾选即被加速）</h2>
      <div class="host-grid" id="hostList"></div>
    </div>

    <div class="card">
      <h2>监听地址 127.0.0.1:26561</h2>
      <div class="hint">把系统/应用的 HTTP(S) 代理指向 127.0.0.1:26561 即可生效。勾选域名做 HTTPS 解密加速，未勾选域名透明直连。</div>
    </div>

    <div class="card">
      <h2>运行日志</h2>
      <pre id="logView" class="log"></pre>
    </div>
  </main>

  <script>
    const invoke = window.__TAURI__.core.invoke;
    const $ = (id) => document.getElementById(id);
    let currentHosts = [];
    let running = false;

    function renderHosts() {
      const box = $('hostList');
      box.innerHTML = '';
      currentHosts.forEach((h) => {
        const item = document.createElement('label');
        item.className = 'host-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = true;
        cb.onchange = () => saveHosts();
        const span = document.createElement('span');
        span.textContent = h;
        item.appendChild(cb); item.appendChild(span);
        box.appendChild(item);
      });
    }

    function show(msg) { $('certMsg').textContent = msg; }

    async function refresh() {
      const s = await invoke('status');
      running = s.running;
      currentHosts = s.hosts;
      $('statusDot').className = 'dot' + (running ? ' running' : '');
      $('statusTxt').textContent = running ? '运行中 @ 127.0.0.1:' + s.port : '未运行';
      $('btnToggle').textContent = running ? '停止加速' : '开始加速';
      $('btnToggle').className = 'btn' + (running ? ' stop' : '');
      renderHosts();
    }

    async function saveHosts() {
      const checked = [];
      document.querySelectorAll('.host-item input:checked').forEach((cb) => {
        checked.push(cb.nextElementSibling.textContent);
      });
      await invoke('set_hosts', { hosts: checked });
    }

    $('btnToggle').onclick = async () => {
      try {
        if (running) { await invoke('stop_proxy'); show('已停止'); }
        else { await invoke('start_proxy'); show('已启动，代理地址 127.0.0.1:26561'); }
        await refresh();
      } catch (e) { show('操作失败: ' + e); }
    };

    $('btnExportCa').onclick = async () => {
      try { const p = await invoke('export_ca'); show('根证书已导出: ' + p); }
      catch (e) { show('导出失败: ' + e); }
    };

    $('btnInstallCa').onclick = async () => {
      try { show((await invoke('install_ca'))); }
      catch (e) { show('安装失败: ' + e); }
    };

    refresh().catch((e) => show('初始化失败: ' + e));
    setInterval(() => refresh().catch(() => {}), 3000);

    let lastLogLen = 0;
    async function pollLogs() {
      try {
        const lines = await invoke('get_logs');
        if (lines.length !== lastLogLen) {
          lastLogLen = lines.length;
          $('logView').textContent = lines.join('\n');
          $('logView').scrollTop = $('logView').scrollHeight;
        }
      } catch (e) {}
    }
    setInterval(pollLogs, 1200);
    pollLogs();
  </script>
</body>
</html>
