<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steam++ 网络加速</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f6f8; color: #1f2329; height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 12px 20px;
      border-bottom: 1px solid #e4e6ea; background: #fff;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #cfd3d9; flex: none; }
    .dot.running { background: #21b06a; box-shadow: 0 0 8px #21b06a; }
    #statusTxt { font-size: 13px; color: #5a616b; }
    .spacer { flex: 1; }
    #traffic { font-size: 13px; color: #5a616b; font-variant-numeric: tabular-nums; }
    .btn {
      border: 0; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer;
      background: #2b6cff; color: #fff; transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn.stop { background: #cf3a45; }
    .btn.ghost { background: #eef1f5; color: #333; }
    .btn.sm { padding: 5px 12px; font-size: 13px; }
    main { flex: 1; overflow-y: auto; padding: 16px 20px; max-width: 820px; width: 100%; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e4e6ea; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .card h2 { font-size: 14px; font-weight: 600; color: #3c4147; }
    .card-head .hint-ms { margin-right: auto; }
    .host-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
    .host-item {
      display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px;
      background: #f7f8fa; border: 1px solid #ebedf0; cursor: pointer; font-size: 13px;
    }
    .host-item input { accent-color: #2b6cff; width: 14px; height: 14px; }
    .host-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .host-ms { font-size: 12px; color: #21b06a; }
    .host-ms.bad { color: #cf3a45; }
    .act { display: flex; gap: 10px; }
    .hint { font-size: 12px; color: #8a919c; line-height: 1.6; }
    .msg { font-size: 12px; color: #2b6cff; margin-top: 8px; }
    .log {
      height: 130px; overflow-y: auto; background: #0f1115; color: #c8d1d9;
      border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <header>
    <div class="dot" id="statusDot"></div>
    <h1>Steam++ 网络加速</h1>
    <span id="statusTxt">未运行</span>
    <div class="spacer"></div>
    <span id="traffic"></span>
    <button class="btn" id="btnToggle">开始加速</button>
  </header>

  <main>
    <div class="card">
      <div class="card-head"><h2>HTTPS 加速证书</h2><div class="hint-ms"></div>
        <button class="btn ghost sm" id="btnExportCa">导出</button>
        <button class="btn ghost sm" id="btnInstallCa">安装到系统</button>
      </div>
      <div class="hint">让系统信任根证书后，HTTPS 加速才生效。安装到系统会弹窗提权。</div>
      <div class="msg" id="certMsg"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>加速域名</h2><div class="hint-ms"></div>
        <button class="btn ghost sm" id="btnTest">测试连通</button>
      </div>
      <div class="host-grid" id="hostList"></div>
      <div class="msg" id="testMsg"></div>
      <div class="hint" style="margin-top:10px">勾选即加速（HTTPS 解密），未勾选透明直连。系统代理指向 127.0.0.1:26561。</div>
    </div>

    <div class="card">
      <div class="card-head"><h2>运行日志</h2><div class="hint-ms"></div></div>
      <pre id="logView" class="log"></pre>
      <div class="hint" style="margin-top:8px">关闭窗口转后台运行，可在系统托盘恢复或退出。</div>
    </div>
  </main>

  <script>
    const invoke = window.__TAURI__.core.invoke;
    const $ = (id) => document.getElementById(id);
    let currentHosts = [];
    let running = false;
    let lastStats = { upBytes: 0, downBytes: 0 }, lastStatsT = 0;
    let renderedKey = '';

    function fmtRate(bps) {
      if (bps >= 1024 * 1024) return (bps / 1024 / 1024).toFixed(1) + ' MB';
      if (bps >= 1024) return (bps / 1024).toFixed(0) + ' KB';
      return bps.toFixed(0) + ' B';
    }

    function renderHosts() {
      const box = $('hostList');
      box.innerHTML = '';
      currentHosts.forEach((h) => {
        const item = document.createElement('label');
        item.className = 'host-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = true;
        cb.onchange = () => saveHosts();
        const name = document.createElement('span');
        name.className = 'host-name'; name.textContent = h;
        const ms = document.createElement('span');
        ms.className = 'host-ms'; ms.id = 'hms-' + h.replace(/[^a-z0-9]/gi, '');
        item.appendChild(cb); item.appendChild(name); item.appendChild(ms);
        box.appendChild(item);
      });
    }

    function show(el, msg) { $(el).textContent = msg; }

    async function refresh() {
      const s = await invoke('status');
      running = s.running;
      currentHosts = s.hosts;
      $('statusDot').className = 'dot' + (running ? ' running' : '');
      $('statusTxt').textContent = running ? '运行中' : '未运行';
      $('btnToggle').textContent = running ? '停止加速' : '开始加速';
      $('btnToggle').className = 'btn' + (running ? ' stop' : '');
      const key = currentHosts.join(',');
      if (key !== renderedKey) { renderedKey = key; renderHosts(); }
    }

    async function checkedHosts() {
      const out = [];
      document.querySelectorAll('.host-item input').forEach((cb) => {
        if (cb.checked) out.push(cb.closest('label').querySelector('.host-name').textContent);
      });
      return out;
    }

    async function saveHosts() {
      await invoke('set_hosts', { hosts: await checkedHosts() });
    }

    async function pollStats() {
      try {
        const s = await invoke('get_stats');
        const t = Date.now();
        if (lastStatsT) {
          const dt = (t - lastStatsT) / 1000 || 1;
          const up = (s.upBytes - lastStats.upBytes) / dt;
          const down = (s.downBytes - lastStats.downBytes) / dt;
          $('traffic').textContent = '↓ ' + fmtRate(down) + '/s  ↑ ' + fmtRate(up) + '/s';
        }
        lastStats = s; lastStatsT = t;
      } catch (e) {}
    }

    $('btnToggle').onclick = async () => {
      try {
        if (running) { await invoke('stop_proxy'); show('certMsg', '已停止'); }
        else { await invoke('start_proxy'); show('certMsg', '已启动，代理 127.0.0.1:26561'); }
        await refresh();
      } catch (e) { show('certMsg', '操作失败: ' + e); }
    };

    $('btnExportCa').onclick = async () => {
      try { const p = await invoke('export_ca'); show('certMsg', '已导出: ' + p); }
      catch (e) { show('certMsg', '导出失败: ' + e); }
    };

    $('btnInstallCa').onclick = async () => {
      try { show('certMsg', await invoke('install_ca')); }
      catch (e) { show('certMsg', '安装失败: ' + e); }
    };

    $('btnTest').onclick = async () => {
      const hosts = await checkedHosts();
      if (!hosts.length) { show('testMsg', '请先勾选域名'); return; }
      show('testMsg', '测试中…');
      try {
        const res = await invoke('connectivity_test', { hosts });
        const ok = res.filter((r) => r.ok).length;
        res.forEach((r) => {
          const id = 'hms-' + r.host.replace(/[^a-z0-9]/gi, '');
          const el = document.getElementById(id);
          if (el) { el.textContent = r.ok ? r.ms + 'ms' : '✗'; el.className = 'host-ms' + (r.ok ? '' : ' bad'); }
        });
        show('testMsg', ok + '/' + res.length + ' 可达');
      } catch (e) { show('testMsg', '测试失败: ' + e); }
    };

    refresh().catch((e) => show('certMsg', '初始化失败: ' + e));
    setInterval(() => refresh().catch(() => {}), 3000);
    setInterval(pollStats, 1000);

    let lastLogLen = 0;
    async function pollLogs() {
      try {
        const lines = await invoke('get_logs');
        if (lines.length !== lastLogLen) {
          lastLogLen = lines.length;
          const lv = $('logView');
          lv.textContent = lines.join('\n');
          lv.scrollTop = lv.scrollHeight;
        }
      } catch (e) {}
    }
    setInterval(pollLogs, 1200);
    pollLogs();
  </script>
</body>
</html>
